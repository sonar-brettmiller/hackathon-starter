# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.scannerwork/**,**/public/lib/**,**/public/css/lib/**,**/test/**,**/*.test.js,**/*.spec.js,**/playwright.config.js,**/public/js/lib/**

# Test Configuration
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/*.spec.js,**/public/**,**/views/**,**/config/**

# JavaScript/Node.js Specific Settings
sonar.javascript.node.maxspace=4096