# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0.0

# Source Code Configuration
sonar.sources=.
sonar.tests=test

# Language Configuration
sonar.language=js
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=node_modules/**,\
  coverage/**,\
  .nyc_output/**,\
  public/lib/**,\
  public/css/**,\
  public/fonts/**,\
  public/js/lib/**,\
  dist/**,\
  build/**,\
  *.test.js,\
  *.spec.js,\
  test/**

# Test Inclusions
sonar.test.inclusions=test/**/*.js,\
  **/*.test.js,\
  **/*.spec.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,\
  **/*.test.js,\
  **/*.spec.js,\
  public/**,\
  config/**

# Code Analysis Parameters
sonar.sourceEncoding=UTF-8

# Duplication Settings
sonar.cpd.exclusions=test/**,\
  **/*.test.js,\
  **/*.spec.js

# Issue Settings
sonar.issue.ignore.multicriteria=e1,e2

# Ignore common false positives in Node.js projects
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3923
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1128
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.js