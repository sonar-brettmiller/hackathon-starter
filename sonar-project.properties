# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=.
sonar.tests=test,tests,__tests__,spec

# Exclusions
sonar.exclusions=**/node_modules/**,**/bower_components/**,**/dist/**,**/build/**,**/target/**,**/*.min.js,**/*.bundle.js,**/vendor/**,**/coverage/**,**/.next/**,**/.nuxt/**,**/out/**,**/.cache/**,**/.temp/**,**/.tmp/**,**/logs/**,**/*.log

# Test Exclusions
sonar.test.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts,**/__tests__/**,**/test/**,**/tests/**,**/spec/**

# Coverage Exclusions
sonar.coverage.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts,**/__tests__/**,**/test/**,**/tests/**,**/spec/**,**/mocks/**,**/*.config.js,**/*.config.ts

# Source Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings (will be auto-detected)
# JavaScript/TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/lcov-report/lcov.info

# Duplication settings
sonar.cpd.exclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts
