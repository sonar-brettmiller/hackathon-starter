# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Metadata
sonar.projectName=Hackathon Starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**/*.js,test/**/*.test.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=**/__tests__/**,**/test/**,**/tests/**,**/*.test.js,**/*.spec.js,**/e2e/**,**/e2e-nokey/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/tmp/**,**/*.min.js,**/public/js/lib/**,**/public/css/**,**/.scannerwork/**,**/vendor/**,**/*.scss

# JavaScript/Node.js Specific
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info

# Source Encoding
sonar.sourceEncoding=UTF-8

# Ignore Duplications in Test Files
sonar.cpd.exclusions=**/test/**,**/tests/**

# Additional Language Settings
sonar.language=js
sonar.javascript.file.suffixes=.js

# Security Hotspot Rules
sonar.security.hotspots.enabled=true

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300