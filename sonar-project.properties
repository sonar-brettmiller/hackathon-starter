# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=Hackathon Starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=app.js,controllers,models,config,public/js
sonar.tests=test

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**,public/lib/**,public/css/**,*.min.js
sonar.test.exclusions=test/**,**/*.test.js,**/*.spec.js

# Coverage Settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,**/*.test.js,**/*.spec.js,config/**,public/**

# Language Settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript/Node.js Specific
sonar.javascript.node.maxspace=4096

# Duplication Settings
sonar.cpd.exclusions=test/**,**/*.test.js,**/*.spec.js