# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/public/lib/**,**/public/js/lib/**

# Test Files
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*.test.js,**/*.spec.js,**/public/**,**/views/**,**/config/**

# Language-specific settings
sonar.javascript.node.maxspace=4096

# Duplication exclusions
sonar.cpd.exclusions=**/test/**,**/tests/**,**/public/**,**/views/**