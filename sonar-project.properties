# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.min.js,**/public/css/**,**/public/lib/**,**/*.scss,**/vendor/**,**/tmp/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**,**/dist/**

# JavaScript/Node.js Specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Code Coverage
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*.test.js,**/*.spec.js,**/node_modules/**

# Duplication
sonar.cpd.exclusions=**/test/**,**/tests/**,**/*.test.js,**/*.spec.js

# Source Encoding
sonar.sourceEncoding=UTF-8

# Additional Settings
sonar.scm.provider=git