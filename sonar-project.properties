# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Settings
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.css.node.maxspace=4096

# Coverage Settings
sonar.coverage.exclusions=**/*.test.js,**/test/**,**/tests/**,**/__tests__/**,**/*.spec.js
sonar.javascript.coveragePlugin=lcov

# Exclusions
sonar.exclusions=**/node_modules/**,**/bower_components/**,**/dist/**,**/build/**,**/tmp/**,**/vendor/**,**/*.min.js,**/*.bundle.js,**/public/js/lib/**,**/coverage/**,**/*.test.js,**/test/**,**/tests/**,**/__tests__/**,**/*.spec.js,**/Dockerfile,**/docker-compose.yml

# Test Files
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/test/**/*.js

# Duplication Settings
sonar.cpd.exclusions=**/test/**,**/tests/**,**/__tests__/**

# Analysis Settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Additional JavaScript Settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300