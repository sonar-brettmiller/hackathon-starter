# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/public/lib/**,**/public/js/lib/**,**/.next/**,**/out/**,**/*.min.js,**/vendor/**

# Test Files
sonar.tests=test
sonar.test.inclusions=test/**/*.js,**/*.test.js,**/*.spec.js

# Coverage Settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,**/*.test.js,**/*.spec.js,**/node_modules/**,**/public/**,**/config/**

# Duplication Settings
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js,**/public/**

# Analysis Settings
sonar.scm.provider=git