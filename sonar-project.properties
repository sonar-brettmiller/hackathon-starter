# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/public/js/lib/**,**/coverage/**,**/test/**,**/*.test.js,**/*.spec.js,**/dist/**,**/build/**,**/.next/**,**/pdfjs-dist/**

# Test Coverage
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/*.spec.js,**/public/**,**/config/**

# Test Files
sonar.tests=test
sonar.test.inclusions=test/**/*.js,**/*.test.js,**/*.spec.js

# Analysis Parameters
sonar.scm.provider=git