# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=Hackathon Starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.javascript.node.maxspace=4096
sonar.language=js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/node_modules/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/bower_components/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/tmp/**,**/public/lib/**,**/public/js/lib/**,**/*.min.js,**/vendor/**

# Test Exclusions
sonar.test.exclusions=**/node_modules/**,**/test/**,**/tests/**,**/*.test.js,**/*.spec.js

# Test Configuration
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Duplicate Detection
sonar.cpd.exclusions=**/public/**,**/node_modules/**

# SCM Configuration
sonar.scm.provider=git
sonar.scm.forceReloadAll=true