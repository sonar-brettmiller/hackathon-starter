# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller

# Project Metadata
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**, \
  **/tmp/**, \
  **/coverage/**, \
  **/dist/**, \
  **/build/**, \
  **/public/css/**, \
  **/public/js/lib/**, \
  **/public/js/main.js, \
  **/test/**, \
  **/tests/**, \
  **/*.spec.js, \
  **/*.test.js, \
  **/Dockerfile, \
  **/docker-compose.yml

# Test Configuration
sonar.test.inclusions=**/test/**, \
  **/tests/**, \
  **/*.spec.js, \
  **/*.test.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info,coverage/lcov.info
sonar.coverage.exclusions=**/test/**, \
  **/tests/**, \
  **/node_modules/**, \
  **/public/js/lib/**, \
  **/config/**, \
  **/*.spec.js, \
  **/*.test.js, \
  **/Dockerfile, \
  **/docker-compose.yml

# Language Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Additional Settings
sonar.scm.provider=git