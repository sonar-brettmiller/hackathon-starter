# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**,.scannerwork/**,public/css/**,public/fonts/**,public/webfonts/**,**/*.test.js,**/*.spec.js,test/**

# Test Settings
sonar.tests=test
sonar.test.inclusions=test/**/*.js,**/*.test.js,**/*.spec.js

# Coverage Settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,**/*.test.js,**/*.spec.js,public/**,views/**,config/**

# Language Settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript/Node.js Specific
sonar.javascript.node.maxspace=4096

# Duplication Settings
sonar.cpd.exclusions=public/**,views/**

# Analysis Settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false