# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source code settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/public/js/lib/**,**/public/js/vendor/**,**/views/**,**/*.pug

# Test file exclusions
sonar.test.inclusions=**/*.test.js,**/*.spec.js,test/**
sonar.tests=test
sonar.test.exclusions=**/node_modules/**

# Coverage settings
sonar.coverage.exclusions=test/**,**/*.test.js,**/*.spec.js,**/config/**,**/public/**

# Duplication exclusions
sonar.cpd.exclusions=test/**,**/*.test.js

# Analysis settings
sonar.scm.provider=git