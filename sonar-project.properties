# Project identification
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source code location
sonar.sources=controllers,models,config,app.js
sonar.tests=test

# Language configuration
sonar.language=js
sonar.javascript.node.maxspace=4096

# Coverage report paths
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=test/**/*,public/**/*,**/*.test.js,**/*.spec.js

# Exclusions
sonar.exclusions=node_modules/**/*,tmp/**/*,coverage/**/*,public/js/lib/**/*,public/css/lib/**/*,*.min.js,Dockerfile,docker-compose.yml
sonar.test.exclusions=test/**/*

# Duplication exclusions
sonar.cpd.exclusions=test/**/*,public/**/*

# Source encoding
sonar.sourceEncoding=UTF-8

# JavaScript specific settings
sonar.javascript.environments=node,mocha,jquery
sonar.javascript.globals=describe,it,before,after,beforeEach,afterEach