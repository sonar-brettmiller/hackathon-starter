# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Configuration
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test

# Language Settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=test/**/*,**/*.test.js,**/*.spec.js

# Test Execution Reports
sonar.testExecutionReportPaths=tmp/coverage

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**,**/dist/**,**/build/**,**/*.min.js,**/public/lib/**,**/vendor/**

# Test File Patterns
sonar.test.inclusions=test/**/*.test.js,test/**/*.spec.js

# Duplication Exclusions
sonar.cpd.exclusions=test/**/*,**/*.test.js,**/*.spec.js

# JavaScript Specific Settings
sonar.javascript.node.maxspace=4096