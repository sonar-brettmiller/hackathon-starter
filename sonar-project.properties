# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,public/js/lib/**,public/css/lib/**

# Test Files
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage Settings
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info,coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/public/**,**/tmp/**

# Language-Specific Settings
sonar.javascript.node.maxspace=4096

# Duplication Settings
sonar.cpd.exclusions=**/test/**,**/tests/**,**/models/**

# Analysis Settings
sonar.scm.provider=git
sonar.scm.disabled=false