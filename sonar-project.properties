# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=.
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/public/lib/**,**/public/js/lib/**,**/public/css/**,**/public/fonts/**

# Test inclusions
sonar.test.inclusions=**/*.test.js,**/*.spec.js,test/**/*.js

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/config/**,**/public/**,**/*.config.js,**/Dockerfile,**/docker-compose.yml

# Coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Additional JavaScript settings
sonar.javascript.node.maxspace=4096