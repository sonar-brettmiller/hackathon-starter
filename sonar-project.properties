# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code
sonar.sources=controllers,models,config,app.js
sonar.tests=test

# Language Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Coverage Settings
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,test/**/*,public/**/*

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/dist/**,**/build/**,**/coverage/**,public/js/lib/**,public/css/**/*.css
sonar.test.exclusions=**/node_modules/**,**/tmp/**

# Duplication Exclusions
sonar.cpd.exclusions=**/test/**,**/public/**

# Source File Encoding
sonar.sourceEncoding=UTF-8

# SCM Settings
sonar.scm.provider=git
