# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=controllers,models,config,app.js
sonar.tests=test

# Language Settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript Specific Settings
sonar.javascript.node.maxspace=4096

# Coverage Settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/test/**,**/node_modules/**,**/public/**,**/views/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/public/js/lib/**,**/public/css/**,**/*.min.js,**/dist/**,**/build/**,**/*.scss,**/views/**/*.pug

# Test Exclusions
sonar.test.inclusions=**/*.test.js,**/test/**/*.js

# Duplication Exclusions
sonar.cpd.exclusions=**/test/**,**/node_modules/**,**/public/**

# SCM Settings
sonar.scm.provider=git

# Analysis Settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300