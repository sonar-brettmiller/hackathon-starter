# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Test and Coverage Settings
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**/*,**/*.test.js,**/*.spec.js,public/**/*,tmp/**/*

# Exclusions
sonar.exclusions=**/node_modules/**,**/bower_components/**,**/dist/**,**/build/**,**/coverage/**,**/tmp/**,public/lib/**,public/js/lib/**,**/*.min.js,**/*.bundle.js

# Duplicate Detection
sonar.cpd.exclusions=test/**/*,public/**/*

# Analysis Settings
sonar.scm.provider=git