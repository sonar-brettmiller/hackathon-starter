# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test

# Language Settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript Specific Settings
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**,**/dist/**,**/build/**,**/*.min.js,**/vendor/**,**/public/css/**,**/public/fonts/**
sonar.test.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/*.spec.js,**/node_modules/**,**/public/**

# Test and Coverage Settings
sonar.testExecutionReportPaths=
sonar.javascript.coveragePlugin=lcov

# Duplication Settings
sonar.cpd.exclusions=**/test/**,**/*.test.js,**/*.spec.js

# Analysis Settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false