# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**,**/dist/**,**/build/**,**/*.min.js,**/public/js/lib/**,**/vendor/**

# Test Settings
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage Settings
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info,coverage/lcov.info
sonar.testExecutionReportPaths=test-report.xml

# Language Specific Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# CSS/SASS Settings
sonar.css.file.suffixes=.css,.scss,.sass

# Duplication Settings
sonar.cpd.exclusions=**/*.spec.js,**/*.test.js

# Analysis Settings
sonar.scm.provider=git
sonar.pullrequest.provider=github