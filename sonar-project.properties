# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info,coverage/lcov.info

# Coverage settings
sonar.coverage.exclusions=**/*test*.js,**/*spec*.js,test/**/*,**/test/**/*,**/*.test.js,**/*.spec.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/tmp/**,**/public/lib/**,**/public/vendor/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.bundle.js

# Test Exclusions
sonar.test.inclusions=test/**/*.test.js,**/*.test.js,**/*.spec.js
sonar.tests=test

# Coverage Inclusions
sonar.coverage.inclusions=**/*.js

# Duplication Exclusions
sonar.cpd.exclusions=**/node_modules/**,**/tmp/**,**/public/**,**/test/**

# Additional JavaScript Settings
sonar.javascript.file.suffixes=.js,.jsx

# Issue Exclusions
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test/**/*.js

# Pull Request Decoration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/hackathon-starter