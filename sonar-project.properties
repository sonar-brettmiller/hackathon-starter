# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=.
sonar.tests=test

# Language Configuration
sonar.language=js
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=**/node_modules/**,\
  **/public/lib/**,\
  **/public/js/lib/**,\
  **/coverage/**,\
  **/tmp/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/vendor/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/test/**

# Test Exclusions
sonar.test.inclusions=**/*.test.js,**/*.spec.js,test/**

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info,coverage/lcov.info
sonar.coverage.exclusions=**/test/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/public/**,\
  **/node_modules/**

# Encoding
sonar.sourceEncoding=UTF-8

# Duplication Settings
sonar.cpd.exclusions=**/test/**,**/*.test.js,**/*.spec.js

# Additional Analysis Parameters
sonar.nodejs.executable=/usr/bin/node