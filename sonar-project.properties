# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Metadata
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code Settings
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.language=js
sonar.javascript.node.maxspace=4096

# Exclusions
sonar.exclusions=**/node_modules/**,\
  **/test/**,\
  **/tests/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/public/js/lib/**,\
  **/public/css/**,\
  **/views/**,\
  **/*.min.js,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/.nyc_output/**,\
  **/Dockerfile,\
  **/docker-compose.yml

# Test Files
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/test/**,\
  **/tests/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/public/**,\
  **/views/**

# Duplication Settings
sonar.cpd.exclusions=**/test/**,**/tests/**,**/*.test.js,**/*.spec.js

# Analysis Parameters
sonar.scm.provider=git
sonar.links.homepage=https://github.com/sonar-brettmiller/hackathon-starter
sonar.links.ci=https://github.com/sonar-brettmiller/hackathon-starter/actions
sonar.links.issue=https://github.com/sonar-brettmiller/hackathon-starter/issues
sonar.links.scm=https://github.com/sonar-brettmiller/hackathon-starter.git