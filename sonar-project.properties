# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/tmp/**,**/coverage/**,**/*.test.js,**/test/**,**/public/js/lib/**,**/public/css/**,**/public/fonts/**,**/*.min.js,**/views/**

# Test Configuration
sonar.tests=test
sonar.test.inclusions=**/*.test.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/public/**,**/views/**,**/config/**

# JavaScript/Node.js Configuration
sonar.javascript.node.maxspace=4096
sonar.sourceEncoding=UTF-8

# Code Analysis Settings
sonar.language=js
sonar.qualitygate.wait=true
