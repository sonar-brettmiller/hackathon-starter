# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Metadata
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0.0

# Source Configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.javascript.node.maxspace=4096
sonar.language=js

# Test Configuration
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js,test/**/*.spec.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**/*,**/*.test.js,**/*.spec.js,public/**/*,**/*.config.js

# Exclusions
sonar.exclusions=node_modules/**/*,coverage/**/*,public/css/**/*,public/js/lib/**/*,dist/**/*,build/**/*,**/*.min.js,**/*.bundle.js,patch-package/**/*

# Duplication Exclusions
sonar.cpd.exclusions=test/**/*,public/**/*

# Analysis Parameters
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300