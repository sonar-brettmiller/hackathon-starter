# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js,test/**/*.spec.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/tmp/**,**/public/js/lib/**,**/public/css/**,**/views/**,**/*.min.js
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**
sonar.coverage.exclusions=test/**/*,**/node_modules/**,**/public/**,**/views/**

# JavaScript Specific Settings
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info,coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Coverage Settings
sonar.coverage.exclusions=test/**/*,**/test/**/*,**/*.test.js,**/*.spec.js,**/node_modules/**,**/public/**,**/views/**

# Encoding
sonar.sourceEncoding=UTF-8

# Duplicate Detection
sonar.cpd.exclusions=**/test/**,**/node_modules/**

# SCM Settings
sonar.scm.provider=git
sonar.scm.disabled=false