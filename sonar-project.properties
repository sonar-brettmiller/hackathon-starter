# SonarCloud Configuration for hackathon-starter
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test

# JavaScript/Node.js specific settings
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info

# Coverage Configuration
sonar.coverage.exclusions=**/*.test.js,**/test/**/*,**/node_modules/**/*,**/public/lib/**/*,**/public/css/**/*

# Exclusions
sonar.exclusions=**/node_modules/**,**/public/lib/**,**/public/css/**,**/*.min.js,**/dist/**,**/build/**,**/coverage/**,**/tmp/**,**/.scannerwork/**,**/Dockerfile,**/docker-compose.yml

# Test Exclusions
sonar.test.exclusions=**/node_modules/**,**/public/**

# Duplication Exclusions
sonar.cpd.exclusions=**/test/**,**/public/lib/**

# Source File Encoding
sonar.sourceEncoding=UTF-8

# SCM Provider
sonar.scm.provider=git