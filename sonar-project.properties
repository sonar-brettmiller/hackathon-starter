# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/public/css/**,**/public/fonts/**,**/public/webfonts/**,**/dist/**,**/build/**,**/*.min.js,**/vendor/**,**/patches/**

# Test Exclusions
sonar.test.exclusions=**/test/**,**/*.test.js,**/*.spec.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/*.spec.js,**/public/**,**/config/**

# Language Settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript/Node.js Specific Settings
sonar.javascript.node.maxspace=4096

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300