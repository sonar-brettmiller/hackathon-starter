# SonarCloud Project Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Source and Test Directories
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js,test/**/*.spec.js

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/tmp/**,**/dist/**,**/build/**,**/*.min.js,public/css/**,public/fonts/**,public/webfonts/**,**/*.scss
sonar.coverage.exclusions=test/**/*,**/*.test.js,**/*.spec.js,config/**/*

# Code Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language Settings
sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=4096

# Quality Gate
sonar.qualitygate.wait=true