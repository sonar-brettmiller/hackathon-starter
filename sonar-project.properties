# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.javascript.node.maxspace=4096
sonar.language=js

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/test/**,**/public/js/lib/**,**/public/lib/**,**/.next/**,**/out/**,**/*.min.js

# Test Configuration
sonar.tests=test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/test/**,**/*.test.js,**/*.spec.js,**/node_modules/**,**/config/**,**/public/**

# Duplication Exclusions
sonar.cpd.exclusions=**/test/**,**/*.test.js,**/*.spec.js

# Analysis Parameters
sonar.scm.provider=git
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/hackathon-starter