# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=controllers,models,config,public/js,app.js
sonar.tests=test

# Language Settings
sonar.language=js
sonar.javascript.node.maxspace=4096

# Coverage Settings
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=test/**/*,**/*.test.js,**/*.spec.js,public/**/*

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/tmp/**,**/.scannerwork/**,**/dist/**,**/build/**,public/lib/**,public/fonts/**,public/css/**
sonar.test.exclusions=test/**/*

# Duplication Settings
sonar.cpd.exclusions=test/**/*,**/*.test.js

# Source File Encoding
sonar.sourceEncoding=UTF-8

# Additional Settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false