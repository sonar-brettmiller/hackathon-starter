# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/coverage/**, **/dist/**, **/build/**, **/*.test.js, **/*.spec.js, **/test/**, **/tests/**, **/public/lib/**, **/public/js/lib/**

# Test Configuration
sonar.tests=test
sonar.test.inclusions=**/*.test.js, **/*.spec.js, test/**

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js, **/*.spec.js, **/test/**, **/tests/**, **/config/**, **/public/**

# Language and Encoding
sonar.sourceEncoding=UTF-8
sonar.language=js

# SonarCloud Host
sonar.host.url=https://sonarcloud.io

# Additional JavaScript Settings
sonar.javascript.node.maxspace=4096