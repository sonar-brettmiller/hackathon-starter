# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.language=js
sonar.javascript.node.maxspace=4096

# Coverage Configuration
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
sonar.coverage.exclusions=test/**/*,**/*.test.js,**/*.spec.js,public/js/**/*

# Exclusions
sonar.exclusions=node_modules/**/*,\
  bower_components/**/*,\
  .git/**/*,\
  dist/**/*,\
  build/**/*,\
  coverage/**/*,\
  tmp/**/*,\
  public/lib/**/*,\
  public/css/**/*.css,\
  **/*.min.js,\
  **/*.bundle.js

# Test Exclusions
sonar.test.inclusions=test/**/*.test.js,test/**/*.spec.js
sonar.tests=test

# Duplication Exclusions
sonar.cpd.exclusions=test/**/*,public/**/*

# Issue Exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3

# Exclude third-party and generated files from issues
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=node_modules/**/*

sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=public/lib/**/*

sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.min.js