# SonarCloud Configuration
sonar.projectKey=hackathon-starter
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=hackathon-starter
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=app.js,controllers,models,config,public/js
sonar.tests=test

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,public/css/**,public/fonts/**,public/webfonts/**,**/*.min.js,**/vendor/**
sonar.test.exclusions=**/node_modules/**,**/coverage/**

# Coverage Configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test/**,**/*.test.js,**/*.spec.js,public/**

# JavaScript/Node.js Settings
sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=4096

# Test Execution
sonar.testExecutionReportPaths=test-results/sonar-report.xml