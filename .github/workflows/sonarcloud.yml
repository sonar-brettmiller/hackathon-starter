name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run SCSS build
        run: npm run scss
      
      - name: Run tests with coverage
        run: npm test
        env:
          NODE_ENV: test
      
      - name: Scan main branch first (if not exists)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking if this is the first scan..."
          echo "For pull requests, we need a baseline branch scan first"
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=hackathon-starter
            -Dsonar.organization=sonar-brettmiller
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/*.test.js,**/test/**,**/tests/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      
      - name: SonarCloud Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}